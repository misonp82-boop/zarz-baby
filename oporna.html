<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অপর্ণা তোমার জন্য</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #ffd1ff, #a18cd1, #fbc2eb);
            background-size: 400% 400%;
            animation: gradientShift 12s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #4a4a4a;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating bubbles */
        .bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.35);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
            z-index: 0;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-25px) scale(1.08); }
        }

        /* Floating hearts rising from bottom */
        .heart-particle {
            position: absolute;
            bottom: -50px;
            font-size: 20px;
            opacity: 0.8;
            animation: rise linear infinite;
            z-index: 0;
            pointer-events: none;
        }
        @keyframes rise {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 0.9;
            }
            100% {
                transform: translateY(-110vh) translateX(var(--drift, 30px)) rotate(360deg);
                opacity: 0;
            }
        }

        /* Sparkles */
        .sparkle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 8px 2px rgba(255,255,255,0.9);
            animation: twinkle 2.5s ease-in-out infinite;
            z-index: 0;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.6); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.8);
            padding: 45px 32px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(255, 105, 180, 0.3);
            width: 90%;
            max-width: 420px;
            text-align: center;
            position: relative;
            z-index: 1;
            animation: popIn 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn {
            0% { transform: scale(0.7) translateY(40px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        h1 {
            color: #d81b60;
            font-size: 30px;
            margin-bottom: 22px;
            font-weight: 700;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.08);
            animation: shimmer 3s ease-in-out infinite;
            background: linear-gradient(90deg, #d81b60, #f50057, #ab47bc, #d81b60);
            background-size: 300% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        @keyframes shimmer {
            0% { background-position: 0% center; }
            100% { background-position: 300% center; }
        }

        p {
            font-size: 18px;
            margin-bottom: 30px;
            color: #6a1b9a;
            line-height: 1.7;
            opacity: 0;
            animation: fadeUp 0.7s ease forwards;
            animation-delay: 0.2s;
        }
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            background: linear-gradient(135deg, #ff4081, #f50057);
            color: white;
            border: none;
            padding: 13px 30px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(245, 0, 87, 0.35);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn.bad {
            background: linear-gradient(135deg, #ab47bc, #7b1fa2);
            box-shadow: 0 5px 15px rgba(123, 31, 162, 0.35);
        }

        .btn::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255,255,255,0.5);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.4s ease, height 0.4s ease;
        }
        .btn:active::after {
            width: 200px;
            height: 200px;
        }

        .btn:hover {
            transform: translateY(-4px) scale(1.06);
            box-shadow: 0 10px 22px rgba(0,0,0,0.25);
        }

        .btn:active {
            transform: translateY(1px) scale(0.97);
        }

        .hidden {
            display: none !important;
        }

        .heart {
            color: #e91e63;
            font-size: 22px;
            animation: pulse 1.5s infinite;
            display: inline-block;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.25); }
            100% { transform: scale(1); }
        }

        .emoji-pop {
            font-size: 40px;
            display: inline-block;
            margin-bottom: 10px;
            animation: bounceIn 0.8s ease;
        }
        @keyframes bounceIn {
            0% { transform: scale(0); }
            60% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="bubble" style="width: 80px; height: 80px; top: 10%; left: 10%; animation-duration: 5s;"></div>
    <div class="bubble" style="width: 120px; height: 120px; bottom: 15%; right: 10%; animation-duration: 7s;"></div>
    <div class="bubble" style="width: 60px; height: 60px; top: 20%; right: 15%; animation-duration: 4s;"></div>

    <div class="card">
        <h1>হ্যালো অপর্ণা! ✨</h1>

        <!-- Step 1 -->
        <div id="step-1">
            <p>কেমন আছো তুমি আজ? <span class="heart">💖</span></p>
            <div class="btn-group">
                <button class="btn" onclick="selectMood('good')">ভালো 😊</button>
                <button class="btn bad" onclick="selectMood('bad')">খারাপ 😔</button>
            </div>
        </div>

        <!-- Step 2: Good Mood -->
        <div id="step-good" class="hidden">
            <div class="emoji-pop">🎉</div>
            <p>বাহ্! শুনে খুব ভালো লাগলো যে তুমি ভালো আছো। তোমার আজকের দিনটি যেন অনেক সুন্দর ও আনন্দের কাটুক! ✨🌸</p>
            <button class="btn" onclick="resetForm()">আবার শুরু করো ↺</button>
        </div>

        <!-- Step 3: Bad Mood -->
        <div id="step-bad" class="hidden">
            <div class="emoji-pop">🤗</div>
            <p>আরে! মন খারাপ করো না তো অপর্ণা। সব খারাপ সময় কেটে যায়, খুব দ্রুত তোমার দিনটি অনেক সুন্দর ও হাসিখুশিতে ভরে উঠবে! 💕✨</p>
            <button class="btn bad" onclick="resetForm()">আবার শুরু করো ↺</button>
        </div>
    </div>

    <script>
        function selectMood(mood) {
            document.getElementById('step-1').classList.add('hidden');
            if (mood === 'good') {
                document.getElementById('step-good').classList.remove('hidden');
                burstHearts(18);
            } else {
                document.getElementById('step-bad').classList.remove('hidden');
                burstHearts(8);
            }
        }

        function resetForm() {
            document.getElementById('step-good').classList.add('hidden');
            document.getElementById('step-bad').classList.add('hidden');
            document.getElementById('step-1').classList.remove('hidden');
        }

        // Continuously spawn a gentle stream of floating hearts
        const heartEmojis = ['💖', '💕', '💗', '✨', '🌸'];
        function spawnHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart-particle';
            heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
            const startX = Math.random() * 100;
            const drift = (Math.random() * 80 - 40) + 'px';
            const duration = 6 + Math.random() * 5;
            heart.style.left = startX + 'vw';
            heart.style.setProperty('--drift', drift);
            heart.style.animationDuration = duration + 's';
            heart.style.fontSize = (14 + Math.random() * 14) + 'px';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), duration * 1000);
        }
        setInterval(spawnHeart, 700);

        // Burst of extra hearts on button click
        function burstHearts(count) {
            for (let i = 0; i < count; i++) {
                setTimeout(spawnHeart, i * 60);
            }
        }

        // Twinkling sparkles scattered on screen
        function spawnSparkle() {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.style.left = Math.random() * 100 + 'vw';
            sparkle.style.top = Math.random() * 100 + 'vh';
            sparkle.style.animationDelay = (Math.random() * 2) + 's';
            document.body.appendChild(sparkle);
            setTimeout(() => sparkle.remove(), 4000);
        }
        setInterval(spawnSparkle, 500);
    </script>
</body>
</html>
