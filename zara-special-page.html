<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>জারা-র জন্য বিশেষ পাতা</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 50%, #ffd1ff 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #4a4a4a;
            overflow: hidden;
            position: relative;
        }
        .bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
            z-index: 0;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }

        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.8);
            padding: 40px 30px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(255, 105, 180, 0.2);
            width: 90%;
            max-width: 420px;
            text-align: center;
            position: relative;
            z-index: 1;
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        h1 {
            color: #d81b60;
            font-size: 28px;
            margin-bottom: 20px;
            font-weight: 700;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }

        p {
            font-size: 18px;
            margin-bottom: 30px;
            color: #6a1b9a;
            line-height: 1.6;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn {
            background: linear-gradient(135deg, #ff4081, #f50057);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(245, 0, 87, 0.3);
            transition: all 0.3s ease;
        }

        .btn.bad {
            background: linear-gradient(135deg, #ab47bc, #7b1fa2);
            box-shadow: 0 5px 15px rgba(123, 31, 162, 0.3);
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .hidden {
            display: none !important;
        }

        .heart {
            color: #e91e63;
            font-size: 22px;
            animation: pulse 1.5s infinite;
            display: inline-block;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="bubble" style="width: 80px; height: 80px; top: 10%; left: 10%; animation-duration: 5s;"></div>
    <div class="bubble" style="width: 120px; height: 120px; bottom: 15%; right: 10%; animation-duration: 7s;"></div>
    <div class="bubble" style="width: 60px; height: 60px; top: 20%; right: 15%; animation-duration: 4s;"></div>

    <div class="card">
        <h1>হ্যালো জারা! ✨</h1>
        
        <!-- Step 1 -->
        <div id="step-1">
            <p>কেমন আছো তুমি আজ? <span class="heart">💖</span></p>
            <div class="btn-group">
                <button class="btn" onclick="selectMood('good')">ভালো 😊</button>
                <button class="btn bad" onclick="selectMood('bad')">খারাপ 😔</button>
            </div>
        </div>

        <!-- Step 2: Good Mood -->
        <div id="step-good" class="hidden">
            <p>বাহ্! শুনে খুব ভালো লাগলো যে তুমি ভালো আছো। তোমার আজকের দিনটি যেন অনেক সুন্দর ও আনন্দের কাটুক! ✨🌸</p>
            <button class="btn" onclick="resetForm()">আবার শুরু করো ↺</button>
        </div>

        <!-- Step 3: Bad Mood (চায়ের লাইন সরিয়ে আপডেট করা হয়েছে) -->
        <div id="step-bad" class="hidden">
            <p>আরে! মন খারাপ করো না তো জারা। সব খারাপ সময় কেটে যায়, খুব দ্রুত তোমার দিনটি অনেক সুন্দর ও হাসিখুশিতে ভরে উঠবে! 💕✨</p>
            <button class="btn bad" onclick="resetForm()">আবার শুরু করো ↺</button>
        </div>
    </div>

    <script>
        function selectMood(mood) {
            document.getElementById('step-1').classList.add('hidden');
            if (mood === 'good') {
                document.getElementById('step-good').classList.remove('hidden');
            } else {
                document.getElementById('step-bad').classList.remove('hidden');
            }
        }

        function resetForm() {
            document.getElementById('step-good').classList.add('hidden');
            document.getElementById('step-bad').classList.add('hidden');
            document.getElementById('step-1').classList.remove('hidden');
        }
    </script>
</body>
</html>
